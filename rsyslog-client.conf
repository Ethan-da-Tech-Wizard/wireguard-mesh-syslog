# ==============================================================================
# Sample Rsyslog Client Configuration for WireGuard Mesh Syslog Forwarding
# ==============================================================================
# File: rsyslog-client.conf
# Target Location on Client Nodes: /etc/rsyslog.d/50-mesh-syslog.conf
# Target Network: Encrypted WireGuard Point-to-Point Mesh Overlay (10.200.0.0/24)
# Compliance Target: Lynis LOGG-2154 (Configure remote log host)
# Author: Tech Wizard <author@users.noreply.invalid>
# Organization: TWU LLC
# License: MIT License (c) 2026 Tech Wizard, TWU LLC
# ==============================================================================
#
# EDUCATIONAL WALKTHROUGH & ARCHITECTURAL FOUNDATION:
#
# 1. THE PROBLEM: EDGE NODE DISK EXHAUSTION (ENOSPC) & SURVIVABILITY
#    In heterogeneous edge topologies, satellite nodes (such as laptops, field devices,
#    or container hosts) frequently operate on constrained local storage. For example,
#    an edge laptop with a 113 GB NVMe SSD running near full capacity (~17 GB free)
#    is exposed to system crashes if runaway daemon logs fill the local filesystem.
#    When local disk reaches 100% capacity:
#      - System services crash or fail to initialize.
#      - The root filesystem may be remounted read-only by the kernel.
#      - Audit and forensic logs are dropped or overwritten.
#    Forwarding logs over the encrypted WireGuard overlay to a dedicated hub (10.200.0.1)
#    relieves edge storage pressure while preserving forensic audit trails.
#
# 2. DISCONNECTED RESILIENCE & QUEUE CAPPING:
#    Edge nodes frequently roam or disconnect from the WireGuard mesh (e.g. laptop lid
#    close, Wi-Fi roaming, or interface downtime).
#    If a syslog client forwards synchronously without buffering, one of two failures occurs:
#      - Option A (Blocking): The system hangs waiting for network timeouts.
#      - Option B (Dropping): Critical security logs are discarded during network gaps.
#    This configuration configures a disk-assisted, asynchronous queue:
#      - queue.type="LinkedList": Asynchronous in-memory queue decouples logging from network.
#      - queue.fileName="mesh_syslog_spool": Spools memory overflow to /var/spool/rsyslog.
#      - queue.maxDiskSpace="1g": STRICT CEILING. Caps maximum disk spool size to 1 GB,
#        guaranteeing that even prolonged network outages CANNOT exhaust the edge disk.
#      - action.resumeRetryCount="-1": Rsyslog retries connection indefinitely.
#      - queue.saveOnShutdown="on": Pending logs are serialized to disk across reboots.
#
# 3. PROTOCOL FORMAT: RFC 5424 VS RFC 3164
#    - RSYSLOG_TraditionalFileFormat (RFC 3164):
#      Legacy BSD format (<PRI>Mmm dd hh:mm:ss HOSTNAME TAG: MSG).
#    - RSYSLOG_SyslogProtocol23Format (RFC 5424):
#      Modern IETF format (<PRI>1 TIMESTAMP HOSTNAME APP-NAME PROCID MSGID SD MSG)
#      with RFC 3339 microsecond timestamps and structured metadata.
#
# 4. LYNIS BENCHMARK LOGG-2154 COMPLIANCE:
#    Lynis security auditing evaluates control LOGG-2154 ("Configure remote log host").
#    Deploying this configuration satisfies LOGG-2154 with zero WAN exposure.
# ==============================================================================

# ------------------------------------------------------------------------------
# Modern RainerScript Syntax (Recommended for Rsyslog v8.x and newer)
# ------------------------------------------------------------------------------

# Define disk-assisted spooling parameters for reliable transmission:
action(
    type="omfwd"
    Target="10.200.0.1"
    Port="6514"
    Protocol="tcp"
    
    # Template Selection:
    # Use RSYSLOG_TraditionalFileFormat for legacy RFC 3164 compatibility,
    # or RSYSLOG_SyslogProtocol23Format for modern RFC 5424 structured logging:
    Template="RSYSLOG_TraditionalFileFormat"
    
    # Resiliency & Queue Settings:
    # If the central receiver is unreachable, buffer logs locally rather than blocking the host:
    action.resumeRetryCount="-1"            # Retry indefinitely on network failure
    action.resumeInterval="10"              # Wait 10 seconds between retry attempts
    queue.type="LinkedList"                 # Asynchronous in-memory linked list queue
    queue.fileName="mesh_syslog_spool"      # Spool to /var/spool/rsyslog when memory cap is reached
    queue.maxDiskSpace="1g"                 # Cap local spool file size to 1 GB (protects against ENOSPC)
    queue.saveOnShutdown="on"               # Persist pending logs to disk upon graceful reboot/shutdown
    queue.size="10000"                      # In-memory capacity (entries)
    queue.dequeueBatchSize="100"            # Batch transmission size for throughput efficiency
)

# ------------------------------------------------------------------------------
# Alternative Legacy Syntax (For older rsyslog v5-v7 or minimal deployments)
# ------------------------------------------------------------------------------
# Uncomment the following block if using legacy rsyslog syntax:
#
# $WorkDirectory /var/spool/rsyslog        # Where to place spool files
# $ActionQueueFileName mesh_syslog_legacy  # Unique name prefix for spool files
# $ActionQueueMaxDiskSpace 1g              # 1 GB disk limit (protects edge node)
# $ActionQueueSaveOnShutdown on            # Save memory queue to disk on shutdown
# $ActionQueueType LinkedList              # Run asynchronously
# $ActionResumeRetryCount -1               # Infinite retries on connection loss
# *.* @@10.200.0.1:6514                     # '@@' specifies reliable TCP protocol
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Quick Verification Instructions:
# ------------------------------------------------------------------------------
# 1. Install this configuration on the client node:
#      sudo cp rsyslog-client.conf /etc/rsyslog.d/50-mesh-syslog.conf
#
# 2. Ensure the spool directory exists with proper permissions:
#      sudo mkdir -p /var/spool/rsyslog
#      sudo chown -R root:root /var/spool/rsyslog
#      sudo chmod 700 /var/spool/rsyslog
#
# 3. Verify WireGuard mesh network connectivity to the hub node:
#      ip addr show wg0
#      ping -c 2 10.200.0.1
#
# 4. Restart rsyslog to activate remote forwarding:
#      sudo systemctl restart rsyslog
#
# 5. Emit a test audit log event:
#      logger -t mesh-audit "WireGuard mesh syslog test from $(hostname)"
# ==============================================================================
