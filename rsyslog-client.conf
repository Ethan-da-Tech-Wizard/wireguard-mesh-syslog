# ==============================================================================
# Sample Rsyslog Client Configuration for WireGuard Mesh Syslog Forwarding
# ==============================================================================
#
# Target File Location on Client Nodes (e.g. Fedora, Debian, Ubuntu):
#   /etc/rsyslog.d/50-mesh-syslog.conf
#
# Architecture Overview:
#   This configuration instructs the local rsyslog daemon on edge/satellite nodes
#   to forward all system and security events across the encrypted WireGuard mesh
#   point-to-point overlay (10.200.0.0/24) to the primary receiver at 10.200.0.1:6514.
#
# Security & Operational Benefits:
#   1. Zero Exposure: Traffic traverses the encrypted WireGuard interface (wg0)
#      using ChaCha20-Poly1305 authenticated encryption. It never hits the public WAN.
#   2. Edge Disk Survivability: Offloads logs immediately to prevent flash/SSD
#      exhaustion (ENOSPC) on resource-constrained satellite nodes.
#   3. CIS & Lynis Compliance: Fully satisfies benchmark LOGG-2154 (Configure remote log host).
#   4. Disconnected Resilience: Configures a memory + disk spool queue so logs
#      are safely buffered if the mesh interface disconnects during sleep or roaming,
#      then flushed automatically upon reconnect.
#
# ==============================================================================

# ------------------------------------------------------------------------------
# Modern RainerScript Syntax (Recommended for Rsyslog v8.x and newer)
# ------------------------------------------------------------------------------

# Define disk-assisted spooling parameters for reliable transmission:
action(
    type="omfwd"
    Target="10.200.0.1"
    Port="6514"
    Protocol="tcp"
    Template="RSYSLOG_TraditionalFileFormat"
    
    # Resiliency & Queue Settings:
    # If the central receiver is unreachable, buffer logs locally rather than blocking the host:
    action.resumeRetryCount="-1"            # Retry indefinitely on network failure
    action.resumeInterval="10"              # Wait 10 seconds between retry attempts
    queue.type="LinkedList"                 # Asynchronous in-memory linked list queue
    queue.fileName="mesh_syslog_spool"      # Spool to /var/spool/rsyslog when memory cap is reached
    queue.maxDiskSpace="1g"                 # Cap local spool file size to 1 GB
    queue.saveOnShutdown="on"               # Persist pending logs to disk upon graceful reboot/shutdown
    queue.size="10000"                      # In-memory capacity (entries)
    queue.dequeueBatchSize="100"            # Batch transmission size for throughput efficiency
)

# ------------------------------------------------------------------------------
# Alternative Legacy Syntax (For older rsyslog v5-v7 or minimal deployments)
# ------------------------------------------------------------------------------
# Uncomment the following block if using legacy rsyslog syntax:
#
# $WorkDirectory /var/spool/rsyslog        # Where to place spool files
# $ActionQueueFileName mesh_syslog_legacy  # Unique name prefix for spool files
# $ActionQueueMaxDiskSpace 1g              # 1 GB disk limit
# $ActionQueueSaveOnShutdown on            # Save memory queue to disk on shutdown
# $ActionQueueType LinkedList              # Run asynchronously
# $ActionResumeRetryCount -1               # Infinite retries on connection loss
# *.* @@10.200.0.1:6514                     # '@@' specifies reliable TCP protocol
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Quick Verification Instructions:
# ------------------------------------------------------------------------------
# 1. Install this file:
#      sudo cp rsyslog-client.conf /etc/rsyslog.d/50-mesh-syslog.conf
# 2. Ensure WireGuard mesh is active:
#      ip addr show wg0
#      ping -c 2 10.200.0.1
# 3. Restart rsyslog:
#      sudo systemctl restart rsyslog
# 4. Emit a test audit log event:
#      logger -t mesh-audit "WireGuard mesh syslog transmission test from $(hostname)"
# ==============================================================================
