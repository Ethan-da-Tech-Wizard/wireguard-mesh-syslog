<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310">
  <defs>
    <style>
      .terminal-bg { fill: #181825; }
      .terminal-header { fill: #11111b; }
      .terminal-title { fill: #a6adc8; font-family: monospace, monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .terminal-text { fill: #cdd6f4; font-family: monospace, monospace; font-size: 13px; }
      .btn-red { fill: #f38ba8; }
      .btn-yellow { fill: #f9e2af; }
      .btn-green { fill: #a6e3a1; }
    </style>
  </defs>
  <rect class="terminal-bg" x="0" y="0" width="860" height="310" rx="10" ry="10" />
  <path class="terminal-header" d="M 0 10 A 10 10 0 0 1 10 0 L 850 0 A 10 10 0 0 1 860 10 L 860 42 L 0 42 Z" />
  <circle class="btn-red" cx="24" cy="21" r="6" />
  <circle class="btn-yellow" cx="42" cy="21" r="6" />
  <circle class="btn-green" cx="60" cy="21" r="6" />
  <text class="terminal-title" x="430" y="26">WireGuard Mesh Syslog Ingestion</text>
  <g class="terminal-text">
    <text x="24" y="80">$ python3 scripts/mesh_log_receiver.py --listen 127.0.0.1.1:5140 --allowed-mesh 127.0.0.1.0/24</text>
    <text x="24" y="102">[mesh-syslog] Initializing Sovereign WireGuard Syslog Collector...</text>
    <text x="24" y="124">[network] Listening on tcp://127.0.0.1.1:5140 (Mesh Interface wg0)</text>
    <text x="24" y="146">[firewall] Enforcing subnet filter: 127.0.0.1.0/24 (non-mesh connections dropped)</text>
    <text x="24" y="168">[auth] Known mesh peers loaded: 6 authorized public keys</text>
    <text x="24" y="190">[stream] Peer connected: 127.0.0.1.4 (node-secops)</text>
    <text x="24" y="212">[stream] Ingesting RFC 5424 syslog frames (Octet Counting mode)...</text>
    <text x="24" y="234">         -&gt; &lt;134&gt;1 2026-11-21T18:00:12Z node-secops auth-daemon - - Session opened for operator</text>
    <text x="24" y="256">         -&gt; &lt;134&gt;1 2026-11-21T18:00:15Z node-secops sudo - - pam_unix(sudo:session): session opened</text>
    <text x="24" y="278">[storage] Appending records atomically to /var/log/mesh/node-secops.log</text>
  </g>
</svg>
